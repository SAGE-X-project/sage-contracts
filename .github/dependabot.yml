version: 2
updates:
  - package-ecosystem: npm
    directory: /ethereum
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, contracts]
    commit-message:
      prefix: chore(deps)
    versioning-strategy: increase
  - package-ecosystem: cargo
    directory: /solana
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, solana]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
