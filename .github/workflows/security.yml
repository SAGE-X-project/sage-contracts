name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  slither:
    name: Slither
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ethereum/package-lock.json
      - name: Install dependencies
        working-directory: ethereum
        run: npm ci --ignore-scripts
      - name: Compile
        working-directory: ethereum
        run: npx hardhat compile
      - name: Record the actual triage check context
        working-directory: ethereum
        run: |
          python3 -B - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          sys.path.insert(0,'scripts')
          from registry_triage import commit_parents
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          names=['contracts/chain-registry/ChainRegistry.sol','slither.db.json','.slither.config.json','scripts/registry_triage.py','scripts/test_registry_triage.py','scripts/registry_slither.py','scripts/test_registry_slither.py','../.github/workflows/security.yml']
          selected=['GITHUB_REPOSITORY','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_EVENT_NAME','GITHUB_SHA','GITHUB_REF','GITHUB_JOB','GITHUB_WORKFLOW_REF','GITHUB_WORKFLOW_SHA','RUNNER_OS','RUNNER_ARCH']
          value={'scope':'Unsigned CI checkout/source observation; not Registry runtime or operating qualification','environment':{name:os.environ[name]for name in selected},'checkout':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parents':commit_parents(git('cat-file','-p','HEAD')),'python':sys.version,'files_sha256':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest()for name in names}}
          with Path('../registry-triage-context.json').open('x')as stream:json.dump(value,stream,indent=2);stream.write('\n')
          PYTHON
      - name: Verify the exact reviewed zero-value invariant
        working-directory: ethereum
        run: |
          registry_unit_status=0
          python3 -B -m trace --count --missing --summary --coverdir triage-coverage scripts/test_registry_triage.py > triage-unit.log 2>&1 || registry_unit_status=$?
          cat triage-unit.log
          test "$registry_unit_status" -eq 0
          python3 -B -m trace --count --missing --summary --coverdir triage-coverage scripts/test_registry_slither.py >> triage-unit.log 2>&1 || registry_unit_status=$?
          cat triage-unit.log
          test "$registry_unit_status" -eq 0
          python3 -B - <<'PYTHON'
          from pathlib import Path
          import re, json
          observations={}
          for name in ['registry_triage', 'test_registry_triage', 'registry_slither', 'test_registry_slither']:
              paths=[p for p in Path('triage-coverage').glob('*.cover') if p.stem.rsplit('.',1)[-1]==name]
              assert len(paths)==1, (name, paths)
              lines=paths[0].read_text().splitlines()
              hit=sum(bool(re.match(r'^\s*\d+:', line)) for line in lines)
              missed=sum(line.startswith('>>>>>>') for line in lines)
              assert hit+missed>0 and hit/(hit+missed)>=0.9, (name, hit, missed)
              observations[name]={'covered':hit,'executable':hit+missed,'scope':'Python executable lines only'}
              print(name, 'Python executable-line coverage', hit, hit+missed)
          with Path('../registry-triage-coverage.json').open('x') as stream:json.dump(observations,stream,indent=2);stream.write('\n')
          PYTHON
      - name: Install the pinned analyzer
        run: pip3 install slither-analyzer==0.11.6 crytic-compile==0.4.2
      - name: Retain and check the fresh untriaged observations
        working-directory: ethereum
        run: |
          python3 -B -c "from pathlib import Path; Path('../registry-triage-empty.json').open('x').write('[]\n')"
          registry_raw_status=0
          REGISTRY_SLITHER_ORDER_RECEIPT=../registry-slither-order-raw.json python3 -B scripts/registry_slither.py . --config-file .slither.config.json --compile-force-framework hardhat --fail-high --triage-database ../registry-triage-empty.json --sarif ../slither-raw-results.sarif --json ../slither-raw-results.json > ../slither-raw-run.log 2>&1 || registry_raw_status=$?
          cat ../slither-raw-run.log
          python3 -B scripts/registry_triage.py raw ../slither-raw-results.json "$registry_raw_status" > ../registry-triage-raw-check.json
      - name: Run Slither (blocking on High)
        working-directory: ethereum
        # crytic-compile >= 0.4 is required to read Hardhat 3 build-info files.
        run: |
          status=0
          REGISTRY_SLITHER_ORDER_RECEIPT=../registry-slither-order-triaged.json python3 -B scripts/registry_slither.py . --config-file .slither.config.json --compile-force-framework hardhat --fail-high --sarif ../slither-results.sarif --json ../slither-results.json > ../slither-run.log 2>&1 || status=$?
          cat ../slither-run.log
          if [ -f ../slither-results.json ]; then cat ../slither-results.json; fi
          exit "$status"
      - name: Check the exact excluded set and unchanged remaining findings
        working-directory: ethereum
        run: python3 -B scripts/registry_triage.py compare ../slither-raw-results.json ../slither-results.json > ../registry-triage-comparison.json
      - name: Preserve actual triage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: registry-triage-evidence
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .github/workflows/security.yml
            ethereum/.slither.config.json
            ethereum/slither.db.json
            ethereum/contracts/chain-registry/ChainRegistry.sol
            ethereum/scripts/registry_triage.py
            ethereum/scripts/test_registry_triage.py
            ethereum/scripts/registry_slither.py
            ethereum/scripts/test_registry_slither.py
            ethereum/triage-unit.log
            ethereum/triage-coverage/
            registry-triage-*.json
            registry-slither-order-*.json
            slither-raw-run.log
            slither-run.log
            slither-raw-results.json
            slither-raw-results.sarif
            slither-results.json
            slither-results.sarif
      - name: Preserve failed analysis diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slither-failure-diagnostics
          if-no-files-found: warn
          path: |
            slither-run.log
            slither-results.json
            slither-results.sarif
      - name: Upload SARIF
        if: always() && hashFiles('slither-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: slither-results.sarif

  npm-licenses:
    name: npm licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: ethereum
        run: npm ci --ignore-scripts
      - name: Check licences
        working-directory: ethereum
        run: |
          npx --yes license-checker@25.0.1 --summary
          npx --yes license-checker@25.0.1 --failOn "GPL;AGPL"
