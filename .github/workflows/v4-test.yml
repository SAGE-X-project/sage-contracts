name: v4 Hardhat build

# Lints and compiles the 0.11.0 chain Registry sources with the Hardhat
# project in v4/ethereum (the same compiler profile Slither analyses).
# Bytecode identity is checked by the component tests, not here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hardhat:
    name: Hardhat lint and compile (v4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v4/ethereum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v4/ethereum/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint Solidity
        run: npm run lint
      - name: Compile
        run: npm run compile
