name: Registry normal-state resource research

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evaluation:
    name: Normal Registry paths (${{ matrix.fork }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fork: [paris, shanghai]
    defaults:
      run:
        working-directory: research/registry-resource-paths
    env:
      SAGE_EVM_FORK: ${{ matrix.fork }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: research/registry-resource-paths/package-lock.json
      - name: Install fixed isolated dependencies
        run: |
          mkdir -p evidence
          npm ci --ignore-scripts --no-audit --no-fund > evidence/npm-ci.log 2>&1
          npm ls --all --json > evidence/npm-tree.json
      - name: Verify fixed compiler, SHA-512 and license inputs
        run: python3 ../registry-ed25519/prepare.py
      - name: Finite units and ordinary state transitions
        run: >-
          node --max-old-space-size=512 --test --test-concurrency=1
          --experimental-test-coverage --test-coverage-lines=90
          --test-coverage-include='**/registry-resource-paths/*.mjs'
          --test-coverage-exclude='**/unit.mjs'
          --test-coverage-exclude='**/suite.mjs'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=evidence/js-coverage.lcov
          suite.mjs > evidence/execution.log 2>&1
      - name: Seal actual source, state and cost evidence
        run: python3 seal.py
      - name: Preserve actual results and original notices
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-resource-paths-${{ matrix.fork }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            research/registry-resource-paths/
            !research/registry-resource-paths/node_modules/
            !research/registry-resource-paths/__pycache__/
            research/registry-ed25519/StrictEd25519.sol
            research/registry-ed25519/prepare.py
            research/registry-ed25519/SOURCE-NOTICES.md
            research/registry-ed25519/LICENSES/speccheck-Apache-2.0.txt
            research/registry-ed25519/upstream/
            research/registry-ed25519/evidence/soljson.cjs
            research/registry-ed25519/evidence/source-receipt.json
            research/registry-bulk-workload/Storage.sol
